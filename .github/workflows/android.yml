name: Piko Beats Android build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/piko-beats-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build static web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Android project
        run: npx cap add android

      - name: Add native browser and request filter
        run: node scripts/prepare-android.mjs

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Smoke-test app startup on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop app.pikobeats.music || true
            adb shell monkey -p app.pikobeats.music 1
            sleep 10
            if ! adb shell pidof app.pikobeats.music; then
              adb logcat -d -t 2000 > /tmp/piko-logcat.txt
              echo "Piko Beats exited after launch. Relevant crash log:"
              grep -n -E "FATAL EXCEPTION|AndroidRuntime|Process: app.pikobeats.music|Fatal signal|chromium" /tmp/piko-logcat.txt || true
              cat /tmp/piko-logcat.txt
              exit 1
            fi
            adb logcat -d -t 1200 | grep -E "FATAL EXCEPTION|AndroidRuntime|Process: app.pikobeats.music" && exit 1 || true

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piko-beats-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  test-pc-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent test dependencies
        run: python -m pip install requests python-dotenv keyring
      - name: Compile PC agent
        run: python -m compileall -q agent
      - name: Test source URL validation
        run: python -m unittest discover -s agent/tests -v
